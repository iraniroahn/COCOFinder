name: Deploy website

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Station data commits made by the update workflow don't trigger push events, so redeploy after it.
  workflow_run:
    workflows: ["Update station data"]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Collect site files
        run: |
          mkdir _site
          cp -r index.html css js data _site/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
